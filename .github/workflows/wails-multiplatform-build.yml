name: Wails Multi-Platform Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'gui-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            tags: "webkit2gtk_4_1"
            ext: ""
          - os: windows-latest
            platform: windows/amd64
            tags: "production"
            ext: ".exe"
          - os: macos-latest
            platform: darwin/universal
            tags: "production"
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Manual Frontend Setup
        working-directory: ./frontend
        run: |
          npm install --include=optional
          npm run build

      - name: Skip Wails Frontend Steps
        run: |
          # We use "true" to skip these steps in the action to avoid redundant installs
          # that fail with Tailwind 4 native bindings.
          perl -i -pe 's/"frontend:install": ".*"/"frontend:install": "true"/' wails.json
          perl -i -pe 's/"frontend:build": ".*"/"frontend:build": "true"/' wails.json

      - name: Build Wails App
        uses: host-uk/build@v4.0.0
        with:
          build-name: context-sherpa${{ matrix.ext }}
          build-platform: ${{ matrix.platform }}
          build-tags: ${{ matrix.tags }}
          package: true
          # Using project's preferred versions
          go-version: '1.25' 
          node-version: '20'

  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Wails Build *
          path: binaries
          merge-multiple: true

      - name: Generate checksums
        working-directory: binaries
        run: |
          rm -f artifact_meta.json
          sha256sum * > ../checksums.txt
          mv ../checksums.txt ./

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Context Sherpa GUI ${{ github.ref_name }}
          files: |
            binaries/*
          generate_release_notes: true