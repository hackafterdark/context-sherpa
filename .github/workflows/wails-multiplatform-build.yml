name: Wails Multi-Platform Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'gui-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            tags: "webkit2gtk_4_1"
          - os: windows-latest
            platform: windows/amd64
            tags: "production"
          - os: macos-latest
            platform: darwin/universal
            tags: "production"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Wails App
        uses: host-uk/build@v4.0.0
        with:
          build-name: context-sherpa
          build-platform: ${{ matrix.platform }}
          build-tags: ${{ matrix.tags }}
          package: true
          # Using project's preferred versions
          go-version: '1.25' 
          node-version: '20'
