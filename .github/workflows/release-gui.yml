name: Release GUI

on:
  push:
    tags:
      - 'gui-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build GUI for ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Build Wails App
        run: |
          wails build -platform ${{ matrix.platform }}

      - name: Rename and Prepare Artifacts (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p output
          cp build/bin/* output/
          cd output
          for f in *; do mv "$f" "gui-${{ github.ref_name }}-$f"; done

      - name: Rename and Prepare Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output
          Copy-Item -Path build/bin/* -Destination output -Recurse
          Get-ChildItem -Path output | ForEach-Object { Move-Item $_.FullName "output/gui-$($env:GITHUB_REF_NAME)-$($_.Name)" }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-binaries-${{ matrix.os }}
          path: output/*

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gui-binaries-*
          path: binaries/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd binaries
          sha256sum * > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries/*
          generate_release_notes: true
